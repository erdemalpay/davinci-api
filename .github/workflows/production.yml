# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js Production CI

on:
  push:
    branches: [production]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Create ssh folder
        run: mkdir -p ~/.ssh
      - name: Adding private key
        run: echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
      - name: Changing permissons of private key
        run: chmod 700 ~/.ssh/id_rsa
      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Sync production release
        run: |
          rsync -avz --delete -r -e "ssh -i ~/.ssh/id_rsa" \
            ./dist ./config Dockerfile.production Dockerfile.franchise1 docker-compose.yml yarn.lock package.json \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:app

      - name: Deploy production and franchise1
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "set -e; cd app; \
            sudo docker compose up -d --build davinci-api-production; \
            sudo docker compose up -d mongo-franchise1 davinci-redis-franchise1; \
            sudo docker compose up mongo-franchise1-init-replica; \
            sudo docker compose up -d --build davinci-api-franchise1; \
            sudo docker system prune -af || true"
